include:
  - ./docker-compose-base.yml
# To ensure that the container processes the locally modified `service_conf.yaml.template` instead of the one included in its image, you need to mount the local `service_conf.yaml.template` to the container.
services:
  hf-model-downloader:
    build:
      context: ./local-demo
      dockerfile: Dockerfile.downloader
    env_file: .env
    volumes:
      - qwen_models:/models
    restart: "no"

  vllm-qwen:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.26.0}
    depends_on:
      hf-model-downloader:
        condition: service_completed_successfully
    env_file: .env
    environment:
      NVIDIA_VISIBLE_DEVICES: ${VLLM_GPU_IDS:-0,1}
    volumes:
      - qwen_models:/models:ro
      - ./local-demo/start-vllm.sh:/usr/local/bin/start-vllm:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/start-vllm"]
    expose: ["8000"]
    networks: [ragflow]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'Authorization: Bearer ${QWEN_API_KEY:-local-demo-key}' http://localhost:8000/v1/models >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 120
      start_period: 60s
    restart: unless-stopped

  local-model-bootstrap:
    image: ${RAGFLOW_IMAGE}
    depends_on:
      ragflow-cpu:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template:ro
      - ./local-demo/bootstrap-models.py:/ragflow/bootstrap-models.py:ro
    entrypoint: ["python", "/ragflow/bootstrap-models.py"]
    networks: [ragflow]
    restart: "no"

  paddleocr-cpu:
    profiles: [paddleocr-cpu]
    build:
      context: ./paddleocr
      args:
        PADDLE_DEVICE_PACKAGE: paddlepaddle==3.2.2
        PADDLE_INDEX_URL: https://www.paddlepaddle.org.cn/packages/stable/cpu/
    environment:
      OCR_DEVICE: cpu
      OCR_MODEL: ${OCR_MODEL:-PP-StructureV3}
      PADDLE_HOME: /models/.paddle
    volumes: [paddle_models:/models]
    networks:
      ragflow:
        aliases: [paddleocr]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  paddleocr-gpu:
    profiles: [paddleocr-gpu]
    build:
      context: ./paddleocr
      args:
        PADDLE_DEVICE_PACKAGE: paddlepaddle-gpu==3.2.2
        PADDLE_INDEX_URL: https://www.paddlepaddle.org.cn/packages/stable/cu118/
    environment:
      OCR_DEVICE: gpu
      OCR_MODEL: ${OCR_MODEL:-PP-StructureV3}
      PADDLE_HOME: /models/.paddle
      NVIDIA_VISIBLE_DEVICES: ${OCR_GPU_ID:-2}
    volumes: [paddle_models:/models]
    networks:
      ragflow:
        aliases: [paddleocr]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${OCR_GPU_ID:-2}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  deepdoc:
    image: ${DEEPDOC_IMAGE:-deepdoc_oss:latest}
    profiles:
      - deepdoc
    build:
      context: ..
      dockerfile: Dockerfile_deepdoc_oss
    networks:
      - ragflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9390/health"]
      interval: 10s
      timeout: 10s
      retries: 60

  ragflow-cpu:
    depends_on:
      mysql:
        condition: service_healthy
      vllm-qwen:
        condition: service_healthy
    profiles:
      - cpu
    image: ${RAGFLOW_IMAGE}
    # Example configuration to set up an MCP server:
    # command:
    #   - --enable-mcpserver
    #   - --mcp-host=0.0.0.0
    #   - --mcp-port=9382
    #   - --mcp-base-url=http://127.0.0.1:9380
    #   - --mcp-script-path=/ragflow/mcp/server/server.py
    #   - --mcp-mode=self-host
    #   - --mcp-host-api-key=ragflow-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # Optional transport flags for MCP (customize if needed).
    # Host mode need to combined with --no-transport-streamable-http-enabled flag, namely, host+streamable-http is not supported yet.
    # The following are enabled by default unless explicitly disabled with --no-<flag>.
    #   - --no-transport-sse-enabled # Disable legacy SSE endpoints (/sse and /messages/)
    #   - --no-transport-streamable-http-enabled #  Disable Streamable HTTP transport (/mcp endpoint)
    #   - --no-json-response # Disable JSON response mode in Streamable HTTP transport (instead of SSE over HTTP)

    # Example configuration to start Admin server:
    command:
      - --enable-adminserver
      - --init-model-provider-tables
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      - ${SVR_WEB_HTTPS_PORT}:443
      - ${SVR_HTTP_PORT}:9380
      - ${ADMIN_SVR_HTTP_PORT}:9381
      - ${SVR_MCP_PORT}:9382 # entry for MCP (host_port:docker_port). The docker_port must match the value you set for `mcp-port` above.
      - ${GO_HTTP_PORT}:9384
      - ${GO_ADMIN_PORT}:9383
    volumes:
      - ./ragflow-logs:/ragflow/logs
      # - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      # - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
    env_file: .env
    networks:
      - ragflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9380/api/v1/system/ping"]
      interval: 15s
      timeout: 5s
      retries: 60
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you use Docker Desktop, the --add-host flag is optional. This flag ensures that the host's internal IP is exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ragflow-gpu:
    depends_on:
      mysql:
        condition: service_healthy
      vllm-qwen:
        condition: service_healthy
    profiles:
      - gpu
    image: ${RAGFLOW_IMAGE}
    # Example configuration to set up an MCP server:
    # command:
    #   - --enable-mcpserver
    #   - --mcp-host=0.0.0.0
    #   - --mcp-port=9382
    #   - --mcp-base-url=http://127.0.0.1:9380
    #   - --mcp-script-path=/ragflow/mcp/server/server.py
    #   - --mcp-mode=self-host
    #   - --mcp-host-api-key=ragflow-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # Optional transport flags for MCP (customize if needed).
    # Host mode need to combined with --no-transport-streamable-http-enabled flag, namely, host+streamable-http is not supported yet.
    # The following are enabled by default unless explicitly disabled with --no-<flag>.
    #   - --no-transport-sse-enabled # Disable legacy SSE endpoints (/sse and /messages/)
    #   - --no-transport-streamable-http-enabled #  Disable Streamable HTTP transport (/mcp endpoint)
    #   - --no-json-response # Disable JSON response mode in Streamable HTTP transport (instead of SSE over HTTP)

    # Example configuration to start Admin server:
    command:
      - --enable-adminserver
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      - ${SVR_WEB_HTTPS_PORT}:443
      - ${SVR_HTTP_PORT}:9380
      - ${ADMIN_SVR_HTTP_PORT}:9381
      - ${SVR_MCP_PORT}:9382 # entry for MCP (host_port:docker_port). The docker_port must match the value you set for `mcp-port` above.
    volumes:
      - ./ragflow-logs:/ragflow/logs
      # - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      # - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
    env_file: .env
    networks:
      - ragflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9380/api/v1/system/ping"]
      interval: 15s
      timeout: 5s
      retries: 60
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you use Docker Desktop, the --add-host flag is optional. This flag ensures that the host's internal IP is exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


